name: 🦀 Rust CI

on:
  push:
    branches: [main, master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  WEBKIT_DISABLE_DMABUF_RENDERER: 1
  WEBKIT_DISABLE_COMPOSITING_MODE: 1

# Verhindert, dass mehrere Läufe desselben Branches/PRs parallel laufen
concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  #  Job 1: Formatierung prüfen (rustfmt)
  # ─────────────────────────────────────────────────────────────
  fmt:
    name: 📝 rustfmt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain (mit rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Formatierung prüfen
        run: cargo fmt --all -- --check

  # ─────────────────────────────────────────────────────────────
  #  Job 2: Clippy Lints
  # ─────────────────────────────────────────────────────────────
  clippy:
    name: 📎 Clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System-Abhängigkeiten (Tauri/Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Rust Toolchain (mit clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          cache-on-failure: true

      - name: Clippy ausführen
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ─────────────────────────────────────────────────────────────
  #  Job 3: Build + Tests (Linux)
  # ─────────────────────────────────────────────────────────────
  test-linux:
    name: 🔨 Build & Test – Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System-Abhängigkeiten (Tauri/Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-linux
          cache-on-failure: true

      - name: 🔍 cargo check
        run: cargo check --all-targets --locked

      - name: 🧪 cargo test
        run: cargo test --all-targets --locked

  # ─────────────────────────────────────────────────────────────
  #  Job 4: Build-Check – Windows (nur Kompilierbarkeit)
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: 🪟 Build-Check – Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-windows
          cache-on-failure: true

      - name: 🔍 cargo check
        run: cargo check --all-targets --locked

name: 🦁 Rust CI & Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z.B. 0.1.0)'
        required: false
        default: '0.1.0'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  WEBKIT_DISABLE_DMABUF_RENDERER: 1
  WEBKIT_DISABLE_COMPOSITING_MODE: 1

# Bricht veraltete Läufe desselben Branches/PRs ab -> spart CI-Minuten
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  # ─────────────────────────────────────────────────────────────
  #  Job 0: CI-Gate – fmt, clippy, test
  #  Alle Bundle-Jobs warten hierauf -> kein Zeit-/Geldverbrauch
  #  für Bundles, wenn der Code eh nicht durchgeht.
  # ─────────────────────────────────────────────────────────────
  ci:
    name: ✅ CI (fmt · clippy · test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf

      - name: Rust Toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci
          cache-on-failure: true

      - name: 📝 rustfmt (nur Warnung, blockiert Build nicht)
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: 📎 Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 🧪 Tests
        run: cargo test --all-targets --locked

  # ─────────────────────────────────────────────────────────────
  #  Job 1: Linux – .deb + .rpm + .AppImage IN EINEM BUILD
  #  (statt 2 getrennten vollen Compiles wie vorher = ~40-50% schneller)
  # ─────────────────────────────────────────────────────────────
  build-linux:
    name: 📦 Linux – deb · rpm · AppImage
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            patchelf curl wget file rpm fakeroot dpkg-dev squashfs-tools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-bundles
          cache-on-failure: true

      - name: Tauri CLI cachen
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-v2-linux-${{ hashFiles('**/Cargo.lock') }}

      - name: Tauri CLI installieren
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: 🔨 Build deb + rpm + AppImage (ein Compile-Durchlauf)
        run: cargo tauri build --bundles deb,rpm,appimage

      - name: Pakete sammeln + Checksums
        run: |
          mkdir -p dist
          find target/release/bundle -name "*.deb" -exec cp {} dist/ \;
          find target/release/bundle -name "*.rpm" -exec cp {} dist/ \;
          find target/release/bundle -name "*.AppImage" -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS.txt && ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: linux-checksums
          path: dist/SHA256SUMS.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  #  Job 2: Snap
  # ─────────────────────────────────────────────────────────────
  build-snap:
    name: 📦 Linux – Snap
    needs: ci
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: snap
          cache-on-failure: true

      - name: System-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            patchelf curl wget file

      - name: Snapd initialisieren & Snapcraft installieren
        run: |
          sudo systemctl enable --now snapd.socket 2>/dev/null || true
          sudo ln -sf /var/lib/snapd/snap /snap 2>/dev/null || true
          timeout 90 sh -c 'until sudo snap version 2>/dev/null; do sleep 5; done'
          sudo snap install snapcraft --classic

      - name: 🔨 Snap bauen
        run: |
          sudo env PATH="$PATH" HOME="$HOME" SNAPCRAFT_BUILD_ENVIRONMENT=host \
            snapcraft --destructive-mode

      - name: Snap sammeln
        run: |
          mkdir -p dist
          find . -maxdepth 1 -name "*.snap" -exec cp {} dist/ \;
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-snap
          path: dist/*.snap
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  #  Job 3: Flatpak
  # ─────────────────────────────────────────────────────────────
  build-flatpak:
    name: 📦 Linux – Flatpak
    needs: ci
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: flatpak
          cache-on-failure: true

      - name: Build-Abhängigkeiten + Flatpak-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            patchelf curl wget file flatpak flatpak-builder

      - name: Flatpak SDKs cachen
        id: flatpak-sdk-cache
        uses: actions/cache@v4
        with:
          path: /var/lib/flatpak
          key: flatpak-sdk-freedesktop-23.08-${{ runner.os }}

      - name: Flatpak SDKs installieren
        if: steps.flatpak-sdk-cache.outputs.cache-hit != 'true'
        run: |
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: 🔨 Release-Binary bauen
        run: cargo build --release --locked

      - name: Vorgebautes Binary + Assets kopieren
        run: |
          cp target/release/Lion-Launcher flatpak/lion-launcher
          cp icons/32x32.png flatpak/icon-32.png
          cp icons/128x128.png flatpak/icon-128.png
          cp icons/icon.png flatpak/icon-256.png

      - name: 🔨 Flatpak bauen
        run: |
          flatpak-builder --repo=flatpak-repo --force-clean --disable-rofiles-fuse \
            flatpak-build flatpak/com.lionlauncher.dev.ci.yml

      - name: Bundle + .flatpakref erstellen
        run: |
          mkdir -p dist
          flatpak build-bundle flatpak-repo dist/lion-launcher.flatpak com.lionlauncher.dev
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          cat > dist/lion-launcher.flatpakref << EOF
          [Flatpak Ref]
          Name=com.lionlauncher.dev
          Branch=stable
          Title=Lion Launcher
          Comment=Ein moderner Minecraft Launcher
          Url=https://dl.flathub.org/repo/
          Homepage=${REPO_URL}
          Icon=${REPO_URL}/raw/main/icons/icon.png
          IsRuntime=false
          SuggestRemoteName=flathub
          EOF
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: dist/lion-launcher.flatpak
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpakref
          path: dist/lion-launcher.flatpakref
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  #  Job 4: Arch Linux – PKGBUILD + .pkg.tar.zst
  # ─────────────────────────────────────────────────────────────
  build-arch:
    name: 📦 Arch Linux – pkg.tar.zst
    needs: ci
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Pacman initialisieren & Update
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm

      - name: Build-Abhängigkeiten
        run: |
          pacman -S --noconfirm --needed \
            base-devel rust cargo git webkit2gtk-4.1 gtk3 \
            libappindicator-gtk3 librsvg pkgconf openssl libsoup3 \
            curl wget file

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arch-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: arch-rust-

      - name: Build-User anlegen (makepkg läuft nicht als root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: 🔨 Release-Binary bauen
        run: |
          su builder -c "
            export RUST_BACKTRACE=1
            cargo build --release --locked
          "

      - name: Version ermitteln
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          [ -z "$VERSION" ] && VERSION="0.1.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: PKGBUILD-Workspace vorbereiten
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          mkdir -p /tmp/pkgbuild-ws /tmp/pkgbuild-out

          cp target/release/Lion-Launcher /tmp/pkgbuild-ws/lion-launcher-bin
          cp icons/32x32.png /tmp/pkgbuild-ws/icon-32.png
          cp icons/128x128.png /tmp/pkgbuild-ws/icon-128.png
          cp icons/icon.png /tmp/pkgbuild-ws/icon-256.png
          [ -f LICENSE ] && cp LICENSE /tmp/pkgbuild-ws/ || true
          [ -f README.md ] && cp README.md /tmp/pkgbuild-ws/ || true

          cat > /tmp/pkgbuild-ws/lion-launcher.desktop << 'DESKTOP_EOF'
          [Desktop Entry]
          Name=Lion Launcher
          Comment=Ein moderner Minecraft Launcher
          Exec=/usr/bin/lion-launcher
          Icon=lion-launcher
          Type=Application
          Categories=Game;
          Keywords=minecraft;launcher;mods;fabric;forge;neoforge;quilt;
          StartupNotify=true
          StartupWMClass=lion-launcher
          DESKTOP_EOF

          cat > /tmp/pkgbuild-ws/PKGBUILD << 'PKGEOF'
          pkgname=lion-launcher
          pkgver=VERSION_PLACEHOLDER
          pkgrel=1
          pkgdesc="Ein moderner Minecraft Launcher mit Fabric, Quilt, Forge und NeoForge-Support"
          arch=('x86_64')
          url="https://github.com/REPO_PLACEHOLDER"
          license=('MIT')
          depends=('webkit2gtk-4.1' 'gtk3' 'libappindicator-gtk3' 'librsvg' 'openssl')
          optdepends=(
              'jdk17-openjdk: Minecraft 1.17+'
              'jdk21-openjdk: Minecraft 1.21+'
          )
          source=('lion-launcher-bin' 'icon-32.png' 'icon-128.png' 'icon-256.png' 'lion-launcher.desktop')
          sha256sums=('SKIP' 'SKIP' 'SKIP' 'SKIP' 'SKIP')
          noextract=('lion-launcher-bin' 'icon-32.png' 'icon-128.png' 'icon-256.png' 'lion-launcher.desktop')

          build() { true }

          package() {
              install -Dm755 "$srcdir/lion-launcher-bin" "$pkgdir/usr/bin/lion-launcher"
              install -Dm644 "$srcdir/icon-32.png" "$pkgdir/usr/share/icons/hicolor/32x32/apps/lion-launcher.png"
              install -Dm644 "$srcdir/icon-128.png" "$pkgdir/usr/share/icons/hicolor/128x128/apps/lion-launcher.png"
              install -Dm644 "$srcdir/icon-256.png" "$pkgdir/usr/share/icons/hicolor/256x256/apps/lion-launcher.png"
              install -Dm644 "$srcdir/lion-launcher.desktop" "$pkgdir/usr/share/applications/lion-launcher.desktop"
              [ -f "$startdir/LICENSE" ] && install -Dm644 "$startdir/LICENSE" "$pkgdir/usr/share/licenses/lion-launcher/LICENSE" || true
              [ -f "$startdir/README.md" ] && install -Dm644 "$startdir/README.md" "$pkgdir/usr/share/doc/lion-launcher/README.md" || true
          }
          PKGEOF

          sed -i -e "s|VERSION_PLACEHOLDER|${VERSION}|g" -e "s|REPO_PLACEHOLDER|${REPO}|g" /tmp/pkgbuild-ws/PKGBUILD
          chown -R builder:builder /tmp/pkgbuild-ws /tmp/pkgbuild-out

      - name: makepkg ausführen
        run: |
          su builder -c "
            cd /tmp/pkgbuild-ws
            PKGDEST=/tmp/pkgbuild-out makepkg -f --noconfirm --noprogressbar --nodeps --skipinteg
          "

      - name: Pakete sammeln
        run: |
          mkdir -p dist
          find /tmp/pkgbuild-out -name "*.pkg.tar.zst" -exec cp {} dist/ \;
          cp pkg/PKGBUILD dist/PKGBUILD
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: arch-pkg
          path: |
            dist/*.pkg.tar.zst
            dist/PKGBUILD
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  #  Job 5: Windows – NSIS .exe
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: 🪟 Windows – .exe
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
          cache-on-failure: true

      - name: Tauri CLI cachen
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-win-${{ hashFiles('**/Cargo.lock') }}

      - name: Tauri CLI installieren
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: 🔨 Windows-Build (NSIS .exe)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  #  Job 6: macOS – .dmg (universal: Intel + Apple Silicon)
  # ─────────────────────────────────────────────────────────────
  build-macos:
    name: 🍎 macOS – .dmg
    needs: ci
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
          cache-on-failure: true

      - name: Tauri CLI cachen
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-v2-macos-${{ hashFiles('**/Cargo.lock') }}

      - name: Tauri CLI installieren
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: 🔨 Universal-Build (.dmg für Intel + Apple Silicon)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: cargo tauri build --bundles dmg --target universal-apple-darwin

      - name: DMG sammeln
        run: |
          mkdir -p dist
          find target/universal-apple-darwin/release/bundle -name "*.dmg" -exec cp {} dist/ \;
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  #  Job 7: Nightly-Release (Push auf main/master, kein Tag)
  # ─────────────────────────────────────────────────────────────
  release-nightly:
    name: 🌙 Nightly-Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - run: find artifacts -type f | sort

      - name: Alten "nightly"-Tag/Release löschen
        run: |
          gh release delete nightly --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh api -X DELETE "/repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Nightly-Release veröffentlichen
        run: |
          FILES=()
          for f in \
            artifacts/linux-deb/*.deb artifacts/linux-rpm/*.rpm \
            artifacts/linux-appimage/*.AppImage artifacts/linux-snap/*.snap \
            artifacts/linux-flatpak/*.flatpak artifacts/arch-pkg/*.pkg.tar.zst \
            artifacts/windows-installer/*.exe artifacts/macos-dmg/*.dmg; do
            [ -f "$f" ] && FILES+=("$f")
          done
          gh release create nightly \
            --target "${GITHUB_SHA}" \
            --title "🌙 Nightly – $(date -u +'%Y-%m-%d') (${GITHUB_SHA:0:7})" \
            --notes "Automatischer Nightly-Build von \`${GITHUB_SHA:0:7}\` (${{ github.ref_name }})" \
            --prerelease --repo "$GITHUB_REPOSITORY" "${FILES[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📡 Backend – Nightly registrieren
        continue-on-error: true
        run: |
          if [ -z "$LAUNCHER_WEBHOOK_SECRET" ]; then
            echo "⚠️  LAUNCHER_WEBHOOK_SECRET nicht gesetzt – übersprungen."
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly"

          post_release() {
            local PLATFORM="$1" FORMAT="$2" FILE="$3"
            local FILENAME SIZE
            FILENAME=$(basename "$FILE")
            SIZE=$(du -sh "$FILE" 2>/dev/null | awk '{print $1}')
            curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X POST "https://api.lion-craft.net/api/launcher/releases" \
              -H "X-Webhook-Token: $LAUNCHER_WEBHOOK_SECRET" -H "Content-Type: application/json" \
              -d "{\"channel\":\"nightly\",\"platform\":\"$PLATFORM\",\"format\":\"$FORMAT\",\"version\":\"$SHORT_SHA\",\"download_url\":\"${BASE_URL}/${FILENAME}\",\"file_size\":\"$SIZE\",\"git_sha\":\"$GITHUB_SHA\"}" \
              | { read -r code; echo "  $PLATFORM/$FORMAT -> HTTP $code"; }
          }

          for f in artifacts/linux-deb/*.deb; do [ -f "$f" ] && post_release linux deb "$f"; done
          for f in artifacts/linux-rpm/*.rpm; do [ -f "$f" ] && post_release linux rpm "$f"; done
          for f in artifacts/linux-appimage/*.AppImage; do [ -f "$f" ] && post_release linux AppImage "$f"; done
          for f in artifacts/windows-installer/*.exe; do [ -f "$f" ] && post_release windows exe "$f"; done
          for f in artifacts/macos-dmg/*.dmg; do [ -f "$f" ] && post_release macos dmg "$f"; done
        env:
          LAUNCHER_WEBHOOK_SECRET: ${{ secrets.LAUNCHER_WEBHOOK_SECRET }}

  # ─────────────────────────────────────────────────────────────
  #  Job 8: Stable-Release (Tag v*)
  # ─────────────────────────────────────────────────────────────
  create-release:
    name: 🚀 Stable-Release
    needs: [build-linux, build-snap, build-flatpak, build-arch, build-windows, build-macos]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - run: find release-artifacts -type f | sort

      - name: SHA256 Gesamtchecksums
        run: |
          cd release-artifacts
          find . -type f ! -name "SHA256SUMS*" ! -name "PKGBUILD" ! -name "*.flatpakref" \
            | sort | xargs sha256sum > SHA256SUMS.txt

      - name: Version extrahieren
        id: version
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: GitHub Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          name: "Lion Launcher ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'alpha') || contains(steps.version.outputs.tag, 'beta') || contains(steps.version.outputs.tag, 'rc') }}
          body: |
            ## 🦁 Lion Launcher ${{ steps.version.outputs.tag }}
            ### 📦 Verfügbare Pakete
            | Format | Plattform | Installationsbefehl |
            |--------|-----------|---------------------|
            | `.deb` | Debian, Ubuntu, Mint, Pop!_OS | `sudo dpkg -i lion-launcher_*.deb` |
            | `.rpm` | Fedora, RHEL, CentOS, openSUSE | `sudo rpm -i lion-launcher-*.rpm` |
            | `.AppImage` | Alle Linux-Distros | `chmod +x && ./lion-launcher_*.AppImage` |
            | `.snap` | Ubuntu + Snap-kompatible Distros | `sudo snap install *.snap --dangerous` |
            | `.flatpak` | Alle Linux-Distros (Flatpak) | `flatpak install lion-launcher.flatpak` |
            | `PKGBUILD` / `.pkg.tar.zst` | Arch Linux, Manjaro | `makepkg -si` oder `sudo pacman -U *.pkg.tar.zst` |
            | `.exe` | Windows 10/11 | NSIS-Installer, WebView2 eingebettet |
            | `.dmg` | macOS (Intel + Apple Silicon) | Universal-Binary |
            ### ✅ Checksums
            Alle SHA-256 Checksums in `SHA256SUMS.txt`.
          files: |
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.snap
            release-artifacts/**/*.flatpak
            release-artifacts/**/*.flatpakref
            release-artifacts/**/*.pkg.tar.zst
            release-artifacts/**/PKGBUILD
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📡 Backend – Stable-Release registrieren
        continue-on-error: true
        run: |
          if [ -z "$LAUNCHER_ADMIN_JWT" ]; then
            echo "⚠️  LAUNCHER_ADMIN_JWT nicht gesetzt – übersprungen."
            exit 0
          fi
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          post_stable() {
            local PLATFORM="$1" FORMAT="$2" FILE="$3"
            local FILENAME SIZE
            FILENAME=$(basename "$FILE")
            SIZE=$(du -sh "$FILE" 2>/dev/null | awk '{print $1}')
            curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X POST "https://api.lion-craft.net/api/launcher/releases" \
              -H "Authorization: Bearer $LAUNCHER_ADMIN_JWT" -H "Content-Type: application/json" \
              -d "{\"channel\":\"stable\",\"platform\":\"$PLATFORM\",\"format\":\"$FORMAT\",\"version\":\"$VERSION\",\"download_url\":\"${BASE_URL}/${FILENAME}\",\"file_size\":\"$SIZE\",\"git_sha\":\"$GITHUB_SHA\"}" \
              | { read -r code; echo "  $PLATFORM/$FORMAT -> HTTP $code"; }
          }

          for f in release-artifacts/linux-deb/*.deb; do [ -f "$f" ] && post_stable linux deb "$f"; done
          for f in release-artifacts/linux-rpm/*.rpm; do [ -f "$f" ] && post_stable linux rpm "$f"; done
          for f in release-artifacts/linux-appimage/*.AppImage; do [ -f "$f" ] && post_stable linux AppImage "$f"; done
          for f in release-artifacts/windows-installer/*.exe; do [ -f "$f" ] && post_stable windows exe "$f"; done
          for f in release-artifacts/macos-dmg/*.dmg; do [ -f "$f" ] && post_stable macos dmg "$f"; done
        env:
          LAUNCHER_ADMIN_JWT: ${{ secrets.LAUNCHER_ADMIN_JWT }}
